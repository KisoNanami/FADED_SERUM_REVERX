<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="fad-ui-design-constitution" content="1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title data-i18n="common.fad_synth"></title>
  <style>
    /* Served by the native resource provider (see TouchPerformWebView);
       base64 inlining is intentionally avoided to keep the page small. */
    @font-face {
      font-family: "Fusion Pixel";
      src: url(/fonts/fusion-pixel-latin.woff2) format("woff2");
      font-display: swap;
    }
    @font-face {
      font-family: "Fusion Pixel ZH";
      src: url(/fonts/fusion-pixel-zh-hans.woff2) format("woff2");
      font-display: swap;
    }
    @font-face {
      font-family: "FAD Mono";
      src: url(/fonts/jetbrains-mono.ttf) format("truetype");
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --paper: #E8E5DB;
      --chrome-surface: #F6F4EC;
      --paper-deep: #D7D3C5;
      --surface-high: #EEECE4;
      --ink: #1C1B14;
      --ink-soft: #4C4A40;
      --ink-faint: #8B8779;
      --screen: #1C1B14;
      --screen-ink: #E4E1D4;
      --screen-accent: #7A9CFF;
      --line: #8B8779;
      --indigo: #3D4A78;
      --accent-ink: #F6F4EC;
      --pine: #50604E;
      --brass: #63558D;
      --text-scale: 1;
      --text-10: 10px;
      --text-11: 11px;
      --text-12: 12px;
      --text-13: 13px;
      --text-15: 15px;
      --compact-control-row: 88px;
      --compact-label-track: 16px;
      --compact-value-track: 20px;
      --compare-control-row: 80px;
      --compare-label-track: 16px;
      --rust: #AC4B2C;
      --paper-high: var(--chrome-surface);
      --mustard: var(--brass);
      --white: var(--screen-ink);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-control: var(--space-1);
      --space-module: var(--space-2);
      --space-group: var(--space-3);
      --space-section: var(--space-4);
      --space-workspace: 24px;
      --target: 48px;
      --chrome-height: 48px;
      --workspace-tabs: 56px;
      --status-message-height: max(48px, calc(var(--text-13) * 2.7 + 12px));
      --status: var(--status-message-height);
      --frame-header: 40px;
      --control-row: 104px;
      --font: "Fusion Pixel ZH", "Fusion Pixel", ui-monospace, monospace;
      --mono: "FAD Mono", "Fusion Pixel ZH", "Fusion Pixel", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    body {
      background: var(--paper-deep);
      color: var(--ink);
      font-family: var(--font);
      font-size: var(--text-15);
      line-height: 1.2;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }
    input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    button, select, input { font: inherit; color: inherit; letter-spacing: 0; }
    button { appearance: none; -webkit-appearance: none; border-radius: 0; -webkit-tap-highlight-color: transparent; }
    select {
      appearance: none; -webkit-appearance: none; border-radius: 0;
      min-width: 44px; min-height: var(--target); border: 1px solid var(--ink);
      background-color: var(--paper-high);
      background-image: linear-gradient(45deg, transparent 50%, var(--indigo) 50%), linear-gradient(135deg, var(--indigo) 50%, transparent 50%);
      background-position: calc(100% - 12px) center, calc(100% - 8px) center;
      background-size: 4px 4px; background-repeat: no-repeat;
      padding: 0 28px 0 var(--space-2);
    }
    button, select, [role="slider"] { transition: none; }
    button:disabled, select:disabled {
      color: var(--ink-faint);
      border-color: var(--ink-faint);
      background-color: var(--paper-deep);
      opacity: 0.68;
    }
    button:focus-visible, select:focus-visible, input:focus-visible, [role="slider"]:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: -2px;
    }
    .shell[aria-busy="true"] [aria-disabled="true"] { opacity: .46; cursor: progress; }

    .shell {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 0;
      display: grid;
      grid-template-rows: var(--chrome-height) var(--workspace-tabs) minmax(0, 1fr) var(--status);
      padding-top: var(--native-safe-top, env(safe-area-inset-top, 0px));
      padding-right: var(--native-safe-right, env(safe-area-inset-right, 0px));
      padding-bottom: max(var(--native-safe-bottom, env(safe-area-inset-bottom, 0px)), var(--native-keyboard-bottom, 0px));
      padding-left: var(--native-safe-left, env(safe-area-inset-left, 0px));
      background-color: var(--paper);
      background-image:
        repeating-linear-gradient(0deg, rgba(29, 28, 24, 0.025) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(29, 28, 24, 0.018) 0 1px, transparent 1px 6px);
    }

    .topbar {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(200px, 1fr) minmax(280px, 1.4fr) max-content;
      align-items: stretch;
      border-bottom: 2px solid var(--ink);
      background: var(--paper-high);
    }
    .brand, .preset-chrome, .commands { min-width: 0; display: flex; align-items: center; }
    .brand { gap: var(--space-2); padding: 0 var(--space-4); border: 0; background: transparent; text-align: left; }
    .brand-mark {
      width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center;
      border: 1px solid var(--ink); background: var(--paper-high); overflow: hidden;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0); }
    .osc-compare { height: 100%; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-1); overflow: auto; }
    .osc-pane { min-width: 0; min-height: 0; display: grid; grid-template-rows: calc(96px + var(--target) - 28px) 24px auto 24px auto 24px auto; align-content: start; border-right: 1px solid var(--line); }
    .osc-pane:last-child { border-right: 0; }
    .osc-pane .visual-strip { height: calc(96px + var(--target) - 28px); }
    .osc-pane .section-label { min-height: 24px; height: 24px; }
    .osc-pane .control-grid,
    .osc-pane .control-grid.is-dense { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(84px, auto); }
    .brand-name { flex-shrink: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 16px; line-height: 1; white-space: nowrap; }
    .brand-version { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--ink-soft); font-size: var(--text-12); white-space: nowrap; }
    .preset-chrome { justify-content: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    .preset-name {
      min-width: 0; width: min(320px, 62vw); text-align: center; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; font-size: 14px;
    }
    .icon-button, .command-button {
      min-width: var(--target); min-height: var(--target); border: 0; border-left: 1px solid var(--line);
      background: transparent; display: inline-grid; place-items: center;
    }
    .icon-button:first-child { border-left: 0; border-right: 1px solid var(--line); }
    .icon-button:active, .command-button:active { background: var(--paper-deep); }
    .commands { display:grid;grid-auto-flow:column;grid-auto-columns:var(--target);justify-content:end; }
    .command-button { flex: 1 1 0; display: flex; align-items: center; justify-content: center; padding: 0 var(--space-4); white-space: nowrap; overflow: hidden; }
    .command-button span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body[data-large-text="true"] .brand-version { display: none; }
    .command-button::before { content: "↥"; margin-right: var(--space-2); font-size: 17px; }
    #panic::before, #debug-report::before, #system-open::before { content: none; }
    #panic, #debug-report, #system-open {padding:0 4px;font-size:11px;}
    #debug-report .command-report-icon { width:18px;height:18px;display:block;flex:0 0 auto; }
    #preset-save::before { content: "↓"; }
    #audition-toggle::before { content: "▶"; }
    #audition-toggle[aria-pressed="true"]::before { content: "■"; }
    #audition-toggle[aria-pressed="true"] { color: var(--rust); background: var(--paper-deep); }

    .workspace-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-bottom: 1px solid var(--ink);
      background: var(--paper-deep);
    }
    .compact-routebar, .landscape-rail { display: none; }
    .workspace-tab {
      min-width: 0; min-height: var(--workspace-tabs); border: 0; border-right: 1px solid var(--line);
      background: transparent; position: relative; padding: 0 var(--space-2); text-transform: uppercase;
    }
    .workspace-tab:last-child { border-right: 0; }
    .workspace-tab.is-active { background: var(--paper-high); }
    .workspace-tab.is-active::after {
      content: ""; position: absolute; left: var(--space-4); right: var(--space-4); bottom: -1px; height: 4px; background: var(--indigo);
    }
    .workspace-index { color: var(--ink-soft); margin-right: 8px; }
    .workspace-label-compact { display: none; }

    .stage { min-width: 0; min-height: 0; overflow: hidden; position: relative; padding: var(--space-4); }
    .workspace { width: 100%; height: 100%; min-height: 0; }
    .workbench-grid {
      height: 100%; min-height: 0; display: grid; gap: var(--space-3);
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr);
    }
    .frame {
      min-width: 0; min-height: 0; display: grid; grid-template-rows: var(--frame-header) minmax(0, 1fr);
      border: 2px solid var(--ink); background: var(--chrome-surface); overflow: hidden;
    }
    .frame-header {
      min-width: 0; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3);
      border-bottom: 1px solid var(--ink); background: var(--paper-high); text-transform: uppercase;
    }
    .frame-code {
      width: 24px; height: 24px; flex: 0 0 24px; display: grid; place-items: center;
      background: var(--ink); color: var(--paper-high); font-size: var(--text-12); line-height: 1;
    }
    .frame-title { font-size: var(--text-15); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .frame-rule { height: 5px; min-width: 16px; flex: 1; opacity: 0.35;
      background: repeating-linear-gradient(0deg, var(--ink) 0 1px, transparent 1px 2px); }
    .frame-meta { color: var(--ink-soft); font-size: var(--text-12); white-space: nowrap; }
    .frame-body { min-width: 0; min-height: 0; overflow: auto; scrollbar-width: thin; }
    .frame-body::-webkit-scrollbar, .preset-list::-webkit-scrollbar, .route-list::-webkit-scrollbar { width: 7px; height: 7px; }
    .frame-body::-webkit-scrollbar-thumb, .preset-list::-webkit-scrollbar-thumb, .route-list::-webkit-scrollbar-thumb { background: var(--ink-soft); }

    .subtabs, .mobile-task-tabs, .section-tabs {
      display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
      min-height: var(--target); border-bottom: 1px solid var(--line); background: var(--paper-deep);
    }
    .subtab, .task-tab, .section-tab {
      min-width: 0; min-height: var(--target); border: 0; border-right: 1px solid var(--line);
      background: transparent; padding: 0 var(--space-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .subtab:last-child, .task-tab:last-child, .section-tab:last-child { border-right: 0; }
    .subtab.is-active, .task-tab.is-active, .section-tab.is-active { background: var(--ink); color: var(--paper-high); }
    .section-tab[data-library-section="vital"] { display:flex;align-items:center;justify-content:center;gap:6px; }
    .library-source-icon { display:block;flex:none;width:24px;height:24px;pointer-events:none; }
    .mobile-task-tabs { display: none; }

    .visual-strip {
      height: clamp(96px, 14vh, 128px); border-bottom: 1px solid var(--line); background: var(--screen);
      padding: 28px var(--space-3) var(--space-2); position: relative;
    }
    .visual-strip canvas { display: block; width: 100%; height: 100%; }
    .visual-label { position: absolute; right: var(--space-3); top: var(--space-2); max-width: calc(100% - var(--space-4)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--screen-ink); font-size: var(--text-12); line-height: 1; }
    .curve-toolbar {
      height: calc(clamp(96px, 14vh, 128px) + var(--target) - 28px);
      display: grid; grid-template-columns: minmax(0, 1fr) max-content;
      grid-template-rows: var(--target) minmax(0, 1fr); padding: 0 var(--space-2) var(--space-2);
    }
    .curve-toolbar .visual-label { position: static; grid-column: 1; grid-row: 1; max-width: 100%; align-self: center; }
    .curve-toolbar .curve-well-entry {
      position: static; grid-column: 2; grid-row: 1; min-width: 44px; min-height: var(--target);
      padding: 0 var(--space-2); white-space: nowrap;
    }
    .curve-toolbar canvas { grid-column: 1 / -1; grid-row: 2; min-height: 0; }

    .control-grid {
      min-height: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      grid-auto-rows: minmax(var(--control-row), auto); align-content: start; gap: var(--space-1); padding: var(--space-1) var(--space-2);
      background: var(--surface-high);
    }
    .control-grid.is-dense { grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); grid-auto-rows: var(--control-row); }
    .control-cell {
      min-width: 0; min-height: var(--control-row); display: grid; grid-template-rows: 18px 64px 18px;
      align-content: center; align-items: center; justify-items: center; padding: 2px var(--space-2);
      background: transparent;
    }
    .control-cell.is-wide { grid-column: span 2; }
    .control-cell.is-stepper { grid-column: span 2; grid-template-rows: minmax(var(--compact-label-track), max-content) minmax(0, 1fr); }
    .control-cell.is-stepper .control-value.is-embedded { display: none; }
    .control-cell > div:nth-child(2) { width: 100%; min-width: 0; display: grid; place-items: center; }
    .control-label { width: 100%; text-align: center; color: var(--ink-soft); font-size: var(--text-12); line-height: 1; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .control-value { min-width: 64px; max-width: 100%; padding: 0 var(--space-2); color: var(--screen-ink); background: var(--screen); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-12); line-height: 1; }
    .control-value.is-embedded { visibility: hidden; }
    .control-value, .stepper output, .route-amount, .preset-index, .brand-version {
      font-family: var(--mono); font-variant-numeric: tabular-nums;
    }

    .knob-hit {
      --progress: 135deg; --accent: var(--indigo);
      width: 80px; height: 64px; min-width: var(--target); min-height: var(--target);
      display: grid; place-items: center; touch-action: none; cursor: ns-resize;
    }
    .knob-ring {
      width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
      background: transparent;
      position: relative;
    }
    .knob-ring::before {
      content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--paper-high); border: 1px solid var(--ink);
    }
    .knob-face {
      width: 42px; height: 42px; border-radius: 50%; background: var(--screen); border: 2px solid var(--screen-ink);
      position: relative; box-shadow: 2px 2px 0 rgba(29, 28, 24, 0.28);
    }
    .knob-indicator {
      position: absolute; left: 50%; top: 4px; width: 2px; height: 14px; margin-left: -1px;
      transform-origin: 1px 17px; background: var(--white);
    }
    .knob-hit[data-accent="pine"] { --accent: var(--pine); }
    .knob-hit[data-accent="mustard"] { --accent: var(--mustard); }
    .knob-hit[data-accent="brass"] { --accent: var(--brass); }
    .knob-hit:active .knob-face, .knob-hit.is-dragging .knob-face {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 rgba(29, 28, 24, 0.22);
    }
    .control-cell:has(.knob-hit:active) .control-value,
    .control-cell:has(.knob-hit.is-dragging) .control-value {
      background: var(--indigo);
    }

    .mechanical-toggle {
      width: 80px; height: var(--target); display: grid; grid-template-columns: 1fr 1fr;
      border: 2px solid var(--ink); background: var(--paper-deep); padding: 0; touch-action: manipulation;
      box-shadow: 2px 2px 0 var(--ink);
    }
    .mechanical-toggle span { display: grid; place-items: center; min-width: 0; }
    .mechanical-toggle[aria-checked="false"] .zero { background: var(--ink); color: var(--paper-high); }
    .mechanical-toggle[aria-checked="true"] { border-color: var(--pine); }
    .mechanical-toggle[aria-checked="true"] .one { background: var(--pine); color: var(--paper-high); }
    .mechanical-toggle:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }

    .segment-control { width: 100%; min-height: var(--target); display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--ink); }
    .choice-button { min-width: 0; min-height: var(--target); border: 0; border-right: 1px solid var(--ink); background: var(--paper-high); padding: 2px 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; overflow-wrap: normal; line-height: 1.1; font-size: var(--text-12); }
    .choice-button:last-child { border-right: 0; }
    .choice-button.is-active { background: var(--indigo); color: var(--accent-ink); }
    .select-control { width: 100%; min-height: var(--target); border: 1px solid var(--ink); border-radius: 0; background-color: var(--paper-high); padding: 0 28px 0 var(--space-2); }
    .stepper { width: 100%; min-width: calc(var(--target) * 3); min-height: var(--target); display: grid; grid-template-columns: var(--target) minmax(var(--target), 1fr) var(--target); border: 1px solid var(--ink); }
    .stepper button { min-width: var(--target); min-height: var(--target); border: 0; background: var(--paper-deep); display: grid; place-items: center; }
    .stepper output { min-width: 0; width: 100%; display: grid; place-items: center; background: var(--paper-high); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1; }
    .stepper button:active, .choice-button:active, .tool-button:active, .action-button:active, .plus-button:active {
      transform: translate(1px, 1px);
    }

    .sound-source .frame-body, .sound-shaping .frame-body, .sound-dynamics .frame-body { display: block; }
    .stack-body { height: 100%; min-height: 0; display: grid; grid-template-rows: auto 32px minmax(0, 1fr) 32px minmax(0, 1fr); }
    .stack-body > .control-grid { height: auto; align-content: start; grid-auto-rows: var(--control-row); }
    .zone-block { min-height: 0; display: contents; }
    .section-label { min-height: 32px; display: flex; align-items: center; padding: 0 var(--space-3); border-bottom: 1px solid var(--line); background: var(--paper-deep); color: var(--ink-soft); font-size: var(--text-12); line-height: 1; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .mod-grid { grid-template-columns: minmax(0, .9fr) minmax(0, 1.2fr) minmax(0, 1fr); }
    .lfo-selector .lfo-prefix { display: none; }
    .has-lfo-comparison .lfo-selector .lfo-prefix { display: inline; }
    .lfo-selector { grid-auto-flow: row; grid-template-columns: repeat(4, minmax(44px, 1fr)); }
    .has-lfo-comparison .lfo-selector { display: grid; grid-template-columns: repeat(8, minmax(44px, 1fr)); }
    .lfo-bank { display: contents; }
    .lfo-control-grid .control-cell.is-wide { grid-column: span 1; }
    .route-panel-body { height: 100%; min-height: 0; display: grid; grid-template-rows: minmax(150px, 1fr) auto; }
    .route-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      grid-template-rows: none;
      grid-auto-rows: minmax(60px, auto);
      align-content: start;
    }
    .route-row {
      width: 100%; min-height: var(--target); display: grid; grid-template-columns: 36px minmax(0, 1fr) 64px;
      align-items: center; gap: var(--space-2); border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; padding: 0 var(--space-3);
    }
    .route-row.is-active { background: var(--indigo); color: var(--accent-ink); }
    .route-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .route-amount { text-align: right; }
    .route-editor { border-top: 2px solid var(--ink); }
    .macro-body { height: 100%; min-height: 0; display: grid; grid-template-rows: 32px auto 32px minmax(0, 1fr); }
    .library-filter-row { display:flex;gap:8px;padding:8px 0; }
    .library-filter-row > * { min-height:44px;min-width:0;flex:1; }
    .macro-grid { min-height: 0; height: 100%; grid-template-columns: repeat(4, minmax(112px, 1fr)); grid-template-rows: repeat(2, minmax(var(--control-row), 1fr)); }

    .effects-grid { grid-template-columns: minmax(270px, .72fr) minmax(0, 1.28fr); }
    .fx-chain-body {
      width: min(880px, 100%); height: 100%; min-height: 0; margin: 0 auto;
      display: grid; grid-template-rows: minmax(0, 1fr) 56px;
      border-left: 1px solid var(--ink); border-right: 1px solid var(--ink);
      background: var(--surface-high);
    }
    .fx-slot-list {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: grid;
      grid-template-rows: none;
      grid-auto-rows: minmax(60px, auto);
      align-content: start;
    }
    .fx-row {
      min-height: var(--target); display: grid; grid-template-columns: 36px minmax(0, 1fr) var(--target);
