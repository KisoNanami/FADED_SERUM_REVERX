<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="fad-ui-design-constitution" content="1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title data-i18n="common.fad_os"></title>
  <style id="fad-os-instrument-workbench">
    @font-face {
      font-family: "FAD Mono";
      src: url(/fonts/fados-mono.ttf) format("truetype");
      font-display: swap;
    }
    @font-face {
      font-family: "FAD Jura";
      src: url(/fonts/fados-jura.ttf) format("truetype");
      font-weight: 300 700;
      font-display: swap;
    }

    * { box-sizing: border-box; letter-spacing: 0 !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      user-select: none;
    }
    strong, b, h1, h2, h3 { font-weight:400; }
    button, input, select, output { font: inherit; color: inherit; }
    button, select, input { outline: none; border-radius: var(--radius); }
    button {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--ink);
      background: var(--paper-lift);
      color: var(--ink);
      cursor: pointer;
      transition:
        color 140ms ease,
        background-color 140ms ease,
        border-color 140ms ease,
        opacity 140ms ease;
    }
    button:disabled { opacity:.6;cursor:default; }
    .spacer { flex: 1; }
    .mono, .eyebrow, .osbar, .value-readout, .ascii-meter, .ascii-flow, .module-note, .matrix, .statusbar, .engine-readout, .preset-table-head, .preset-row {
      font-family: "FAD Mono", "FAD Pixel", "SFMono-Regular", Menlo, monospace;
    }

    @media (hover: hover) and (pointer: fine) {
      button:hover:not(:disabled) {  background-color: var(--ink);  }
      .nav-button:hover:not(:disabled), .nav-button.is-active:hover:not(:disabled) { border-color: var(--ink); background-color: var(--ink); color: var(--paper-lift); }
      .reset-button:hover:not(:disabled) {  background-color: transparent;  }
      .command-button.primary:hover:not(:disabled), .action-button.primary:hover:not(:disabled),
      .choice-button.is-active:hover:not(:disabled), .library-tab.is-active:hover:not(:disabled) {
        background-color: var(--ink);
        color: var(--paper-lift);
      }
    }
    .os-home { border: 0; cursor: pointer; background: transparent; }
    .os-home:focus-visible { outline: 2px solid var(--indigo); outline-offset: -3px; }
    .osbar .os-title { justify-self: center;  }
    .osbar .os-status { justify-self: end;    }
    .osbar .online { display: inline-flex; align-items: center; margin: 0; color: var(--ink-soft); }
    .status-dot {   margin-right: 6px; background: var(--ink-faint);  border-radius: 50%; box-shadow: none; }
    body[data-engine="native"] .status-dot { background: var(--green); box-shadow: none; }
    body[data-engine="demo"] .status-dot { background: var(--brass); box-shadow: none; }

    .brand-cell, .preset-cell, .engine-cell {
      min-width: 0;
      display: flex;
      align-items: center;
    }
    .brand-mark {
      flex: 0 0 36px;

      position: relative;
      overflow: hidden;

      border-radius: 0;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand-fallback { position: absolute; inset: 0;  place-items: center; font-family: "FAD Mono", "FAD Pixel", monospace; font-size:var(--fs-mono-l); }
    .brand-copy { min-width: 0; }
    .brand-name {  line-height: 1; font-weight: 400; color: var(--ink); }
    .brand-sub {  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;  color: var(--ink-faint); }
    .icon-button, .command-button, .mini-button, .nav-button, .choice-button,
    .library-tab, .fx-chain-item, .action-button, .toggle-button {
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      background: var(--paper-lift);
      box-shadow: none;
    }
    .icon-button:active:not(:disabled):not(:focus-visible),
    .command-button:active:not(:disabled):not(:focus-visible),
    .mini-button:active:not(:disabled):not(:focus-visible),
    .action-button:active:not(:disabled):not(:focus-visible) {
      transform: translate(2px, 2px);
      box-shadow: none;
      transition-duration: 100ms;
    }
    .icon-button {   padding: 0; font-size:var(--fs-px); }
    .icon-button + .icon-button { margin-left: 5px; }
    .preset-copy { min-width: 0; flex: 1; }
    .eyebrow {  color: var(--ink-soft); text-transform: uppercase; }
    .preset-name { min-height:24px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      line-height: 1.1;
    }
    .preset-actions { display: flex; align-items: center;  }
    .command-button {   font-size:var(--fs-px); }
    .command-button + .command-button { margin-left: 5px; }
    .command-button.primary { background: var(--indigo); color: var(--paper-lift); border-color: var(--indigo); font-weight: 400; }
    .preview-flag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 104px;
      height: 26px;
      flex: 0 0 104px;
      margin-left: 9px;
      padding: 4px 7px;
      border: 1px solid var(--rust);
      color: var(--rust);
      background: rgba(172, 75, 44, 0.08);
      font-size:var(--fs-px);
      line-height: 1;
      white-space: nowrap;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms var(--ease-out), visibility 0s linear 120ms;
    }
    body[data-preview="true"] .preview-flag {
      visibility: visible;
      opacity: 1;
      transition-delay: 0s;
    }
    body[data-modified="true"] .preview-flag {
      visibility: visible;
      opacity: 1;
      border-color: var(--indigo);
      color: var(--indigo);
      background: rgba(61, 74, 120, 0.08);
      transition-delay: 0s;
    }
    body[data-preview="true"] .preview-flag {
      border-color: var(--rust);
      color: var(--rust);
      background: rgba(172, 75, 44, 0.08);
    }
    .engine-cell { display: grid;  column-gap: 9px; }
    .engine-meta { min-width: 0; }
    .engine-readout {   color: var(--ink); }
    .engine-readout span { color: var(--ink-faint); }
    .meter-pair { display: grid; row-gap: 5px; }
    .meter-row { display: grid;  align-items: center; font-size:var(--fs-mono-s); }
    .meter-track {  overflow: hidden;   }
    .meter-fill { display: block; width: 100%; height: 100%;  transform: scaleX(0); transform-origin: left center; transition: transform 80ms linear; }

    .workbench {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }
    .sidebar {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;

      border: 0;
    }
    .nav-button {
      width: auto;

      min-height: 0;

      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      border-color: transparent;

      box-shadow: none;
      text-align: left;
    }
    .nav-button::before { display: none; }
    .nav-button .num { display: inline; margin: 0; font-size:var(--fs-px); color: var(--ink-faint); }
    .nav-button .num::before { content: "["; }
    .nav-button .num::after { content: "]"; }
    .nav-button .label { display: inline; font-size:var(--fs-px); }
    .nav-button.is-active {
      position: relative;
      top: 0;

      box-shadow: none;
    }
    .nav-button.is-active .num { color: inherit; opacity: .72; }

    .stage {
      min-width: 0;
      min-height: 0;
      display: grid;

      overflow: hidden;
    }
    .signal-tape {
      min-width: 0;
      display: grid;

      align-items: stretch;

      border-radius: var(--radius);

      color: var(--ink);
      overflow: hidden;
    }
    .tape-label {
      grid-column: 1;
      padding: 10px;
      border-right: 1px solid var(--line);
    }
    .tape-label strong { display: block; font-family: "FAD Mono", "FAD Pixel", monospace; font-size:var(--fs-mono-m); color: var(--indigo); }
    .tape-label span { display: block; margin-top: 8px; color: var(--ink-faint); font-family: "FAD Mono", "FAD Pixel", monospace; font-size:var(--fs-mono-s); line-height: 1.45; }
    .signal-chain {
      grid-row: 1;
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .ascii-flow {
      width: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink-soft);
      font: var(--fs-mono-s)/1.5 "FAD Mono", "FAD Pixel", monospace;
      white-space: pre;
    }
    .ascii-flow .signal-on { color: var(--indigo); }
    .ascii-flow .signal-off { color: var(--ink-faint); }
    .ascii-flow .signal-route { color: var(--ink-soft); }
    .scope-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;

      grid-row: 1;
    }
    #scope { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .scope-label {
      position: absolute;
      top: 6px;
      left: 7px;
      z-index: 1;

      font-family: "FAD Mono", "FAD Pixel", monospace;
      font-size:var(--fs-mono-s);
      pointer-events: none;
    }
    .tape-meter { grid-column: 4; grid-row: 1;  align-content: center; padding: 8px; row-gap: 6px; }
    .tape-meter-row { display: grid; grid-template-columns: 9px 1fr; align-items: center; font-family: "FAD Mono", "FAD Pixel", monospace; font-size:var(--fs-mono-s); color: var(--ink-faint); }
    .tape-meter-track { height: 27px; overflow: hidden; display: flex; align-items: flex-end; border: 1px solid var(--ink); background: var(--paper); }
    .tape-meter-fill { display: block; width: 100%; height: 100%; background: var(--green); transform: scaleY(0); transform-origin: center bottom; transition: transform 80ms linear; }

    .workspace {
      min-width: 0;
      min-height: 0;
      overflow: auto;

      scrollbar-color: var(--ink-soft) var(--paper-deep);
      scrollbar-width: thin;
    }
    .workspace::-webkit-scrollbar { width: 8px; height: 8px; }
    .workspace::-webkit-scrollbar-track { background: var(--paper-deep); border-left: 1px solid var(--line-soft); }
    .workspace::-webkit-scrollbar-thumb { background: var(--ink-soft); border: 2px solid var(--paper-deep); }
    .workspace-tools { display: flex; align-items: center; }

    .module-band, .lfo-card {
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1.5px solid var(--ink);
      border-radius: var(--radius);
      background: var(--paper-lift);
      box-shadow: var(--hard-shadow);
      overflow: hidden;
    }
    .module-band { display: flex; flex-direction: column; }
    .module-head {
      margin: 0;
      padding: 0 8px;
      flex: 0 0 28px;
      display: flex;
      align-items: center;

      color: var(--ink);
      border: 0;
      border-bottom: 1px solid var(--line);
    }
    .module-title {   font-family: "FAD Mono", "FAD Pixel", "PingFang SC", monospace;   }
    .module-note { margin-left: 9px;   }
    .module-scroll { min-height: 0; flex: 1; overflow: auto;  }
    .module-subhead {
      padding: 6px 7px 4px;
      color: var(--ink-faint);
      border-top: 1px solid var(--line-soft);
      font-size:var(--fs-px);
    }
    .module-readout {
      margin: 0;
      padding: 7px 8px;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      background: var(--paper);
      color: var(--blue);
      font-size:var(--fs-px);
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .module-readout small { display: block; margin-bottom: 4px; color: var(--ink-faint); font-size:var(--fs-px); }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 10px;
      padding: 7px;
      border: 0;
    }
    .control-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .control-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .control-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .control-grid .control {
      min-width: 0;
      min-height: 52px;
      padding: 5px 0 7px;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      background: transparent;
    }
    .control-grid .control.is-wide, .osc-primary .control:first-child { grid-column: 1 / -1; }
    .control-head { min-height: 18px; margin: 0 0 4px; display: flex; align-items: center; min-width: 0; }
    .control-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size:var(--fs-px); color: var(--ink-soft); }
    .reset-button { width: 18px; height: 18px; padding: 0; border: 0; background: transparent; color: var(--ink-faint); font-size:var(--fs-px); box-shadow: none; display:grid;place-items:center;line-height:1; }
    .control-body { display: grid; align-items: center; grid-template-columns: minmax(0, 1fr) 57px; column-gap: 6px; }
    .slider-stack { min-width: 0; display: grid; grid-template-rows: 19px; align-items: center; }
    .ascii-meter { display: none; }
    .inline-value-editor { display:flex;align-items:center;justify-content:flex-end;gap:3px;min-width:0;outline:2px solid var(--indigo);outline-offset:-2px; }
    .inline-value-editor input { width:100%;min-width:0;height:100%;padding:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;text-align:inherit;border-radius:0; }
    .inline-value-editor input[aria-invalid="true"] { color:var(--rust); }
    .inline-value-unit { flex:none;font:inherit; }
    .value-readout {
      min-width: 57px;
      width: 57px;
      height: 23px;
      padding: 4px 5px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: var(--paper-lift);
      color: var(--ink);
      text-align: right;
      white-space: nowrap;
      font-size:var(--fs-mono-m);
    }
    input[type="range"] { width: 100%;  margin: 0; appearance: none; -webkit-appearance: none; background: transparent; cursor: ew-resize; accent-color: var(--accent); }
    input[type="range"]::-webkit-slider-runnable-track {   border-radius: 0;  }
    input[type="range"]::-webkit-slider-thumb {    appearance: none; -webkit-appearance: none;  border-radius: 0;   }
    input[type="range"]::-moz-range-track {   border-radius: 0;  }
    input[type="range"]::-moz-range-progress { height: 4px; background: var(--accent); }
    input[type="range"]::-moz-range-thumb {    border-radius: 0;  }
    .toggle-button { position: relative;   padding: 0;   }
    .toggle-button::after { content: ""; position: absolute;      border-radius: 0;   }
    .choice-group { min-height: 25px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); min-width: 0; }
    .choice-button { min-width: 0; padding: 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size:var(--fs-px); border-radius: 0; }
    .choice-button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
    .choice-button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
    .choice-button.is-active {   font-weight: 400; }
    .select-control, .search-input {
      width: 100%;

      padding: 0 6px;
      font-size:var(--fs-px);
    }
    .advanced-bank summary {   cursor: pointer;  list-style: none; }
    .advanced-bank summary::before { content: none; }
    .advanced-bank[open] summary::before { content: "- "; }
    .advanced-bank summary::-webkit-details-marker { display: none; }

    .sound-grid {
      min-height: 0;
      height: auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-areas:
        "osc-a filter amp-env"
        "osc-b utility filter-env";
      grid-template-rows: auto auto;
      gap: 10px;
      padding: 10px 5px 8px 0;
    }
    .sound-grid .module-scroll { overflow: visible; }
    .sound-grid .osc-a { grid-area: osc-a; }
    .sound-grid .osc-b { grid-area: osc-b; }
    .sound-grid .filter-module { grid-area: filter; }
    .sound-grid .utility-module { grid-area: utility; }
    .sound-grid .amp-envelope { grid-area: amp-env; }
    .sound-grid .filter-envelope { grid-area: filter-env; }
    .osc-module .module-scroll { padding: 0; }
    .utility-sections { min-height: 0; flex: 1; overflow: visible; }

    .mod-layout {
      height: calc(100% - 43px);
      display: grid;
    }
    .lfo-grid {  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));  }
    .lfo-card { display: flex; flex-direction: column; }
    .lfo-grid .lfo-card + .lfo-card { margin-top: 0; }
    .lfo-card .control-grid { margin: 0; }
    .matrix-wrap { min-height: 0; flex: 1; overflow: auto; padding: 5px 7px 7px; }
    .matrix { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .matrix th { height: 25px; padding: 4px 5px; border-bottom: 1px solid var(--line); text-align: left;  font-size:var(--fs-mono-m); font-weight: 400; }
    .matrix td {  padding: 3px 5px; border-bottom: 1px solid var(--line-soft); }
    .matrix .row-id { width: 30px; font-size:var(--fs-mono-m); }
    .matrix th:nth-child(2), .matrix th:nth-child(4) { width: 28%; }
    .matrix th:nth-child(3) { width: 32px; }
    .matrix th:nth-child(5) { width: 26%; }
    .matrix .route-arrow { width: 32px; padding-left: 0; padding-right: 0; color: var(--indigo); text-align: center; font-size:var(--fs-px); }
    .compact-param { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) 49px; column-gap: 5px; align-items: center; }
    .compact-param .select-control { grid-column: 1 / -1; }
    .compact-param .value-readout { width: 49px; min-width: 49px; height: 22px; }
    .compact-param input[type="range"] { min-width: 0; }
    .macro-list { min-height: 0;   }
    .macro-row {   gap: 6px; align-items: center;  border-bottom: 1px solid var(--line-soft); }
    .macro-row .macro-label { color: var(--ink-faint); font-family: "FAD Mono", "FAD Pixel", monospace; font-size:var(--fs-mono-s); }

    .fx-layout {
      min-height: 0;
      height: calc(100% - 43px);
      display: grid;
    }
    .fx-chain, .fx-editor {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .fx-chain-title, .fx-toolbar {
      min-height: 30px;
      margin: 0;
      padding: 0 8px;
      display: flex;
      align-items: center;
      background:
        repeating-linear-gradient(0deg, transparent 0 2px, rgba(28, 27, 20, 0.08) 2px 3px) 0 50% / 100% 12px no-repeat,
        var(--paper-lift);
      color: var(--ink);
      border: 0;
      border-bottom: 1px solid var(--line);
    }
    .fx-chain-title { font-size:var(--fs-px); }
    .fx-slot-list { min-height: 0;    }
    .fx-chain-item {
      width: 100%;
      display: grid;
      align-items: center;

      padding: 5px 7px;
      background: var(--paper-lift);

      text-align: left;
    }
    .fx-chain-item.is-active { border-color: var(--indigo);   }
    .fx-chain-item.is-empty { color: var(--ink-faint); border-style: dashed;  box-shadow: none; }
    .fx-chain-item .fx-num { font-family: "FAD Mono", "FAD Pixel", monospace; font-size:var(--fs-mono-s); color: var(--ink-faint); }
    .fx-chain-item .fx-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size:var(--fs-px); }
    .fx-chain-item .fx-state { width: 7px; height: 7px; border: 1px solid var(--ink); border-radius: 50%; background: var(--pine); box-shadow: none; }
    .fx-editor { padding-left: 0;  }
    .fx-toolbar .module-title { color: var(--ink); }
    .fx-toolbar .toggle-button { margin-left: 6px; border-color: var(--ink); }
    .mini-button { width: 28px; height: 24px; padding: 0; margin-left: 5px; font-size:var(--fs-px); box-shadow: none; }
    .fx-topology {
      color: var(--blue);

      line-height: 1.7;
    }

    body[data-workspace="library"] .workspace { display: grid; grid-template-rows: minmax(0, 1fr); overflow: hidden; }
    .library-shell {   grid-template-rows: auto minmax(0, 1fr); padding: 10px 5px 7px 0; }
    .library-tools { display: grid;  column-gap: 8px;  }
    .library-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); min-width: 0; }
    .library-tab { min-width: 0; height: 29px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size:var(--fs-px); box-shadow: none; }
    .library-tab + .library-tab { border-left: 0; }
    .library-tab:first-child { border-radius: var(--radius) 0 0 var(--radius); }
    .library-tab:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
    .library-tab.is-active { background: var(--indigo); color: var(--paper-lift); font-weight: 400; }
    .library-body {  display: grid;  column-gap: 10px; overflow: hidden; }
    .preset-list {
      min-height: 0;
      overflow: auto;
      border: 1.5px solid var(--ink);
      border-radius: var(--radius);
      background: var(--paper-lift);
      box-shadow: var(--hard-shadow);
    }
    .preset-table-head, .preset-row {
      display: grid;

      align-items: center;
      column-gap: 8px;
      padding: 0 10px;
    }
    .preset-table-head { position: sticky; top: 0; z-index: 2; min-height: 30px; border-bottom: 1px solid var(--line);   font-size:var(--fs-mono-s); }
    .preset-row { width: 100%; min-height: 40px; border: 0; border-bottom: 1px solid var(--line-soft); border-radius: 0; background: transparent; text-align: left;  }
    .preset-row .cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preset-row .index { color: var(--ink-soft); }
    .preset-row .name { font-size:var(--fs-mono-m); }

    /* The audio path drawn where it lives: OSC A/B merge into FILTER, FILTER

    .rack-cell { position: relative; }
    .rack-osc-a::after, .rack-filter::after {
      content: "";
      position: absolute;
      top: 50%;
      right: calc(-1 * var(--rack-column-gap));
      width: var(--rack-column-gap);
      height: 1px;
      background: var(--indigo);
      transform: translateY(-0.5px);
      pointer-events: none;
      z-index: 1;
    }
    .rack-osc-b::after {
      content: "";
      position: absolute;
      top: calc(-50% - var(--rack-row-gap));
      right: calc(-1 * var(--rack-column-gap));
      width: var(--rack-column-gap);
      height: calc(100% + var(--rack-row-gap));
      box-sizing: border-box;
      border-right: 1px solid var(--indigo);
      border-bottom: 1px solid var(--indigo);
      pointer-events: none;
      z-index: 1;
    }
    .rack-osc-a::before, .rack-osc-b::before, .rack-filter::before {
      content: "";
      position: absolute;
      top: 50%;
      right: calc(-1 * var(--rack-column-gap) + 1px);
      width: 3px;
      height: 3px;
      background: var(--indigo);
      transform: translateY(-1.5px);
      pointer-events: none;
      z-index: 1;

      content: "";
      position: absolute;
      top: calc(-1 * var(--rack-row-gap));
      left: 50%;

      height: var(--rack-row-gap);
      background: repeating-linear-gradient(0deg, var(--ink-faint) 0 2px, transparent 2px 4px);

      position: absolute;
      top: calc(-1 * var(--rack-row-gap));
      left: calc(50% - 1px);
      width: 3px;
      height: 2px;
      background: var(--ink-faint);
      pointer-events: none;
      z-index: 1;

          var commands = Array.isArray(command) ? command : [command];
          var wireCommands = [];
          for (var c = 0; c < commands.length; c++) {
            var wireCommand = String(commands[c]);
            if (/^fx-(remove|move)\|/.test(wireCommand))

      function requestParameterContext(id, x, y) {
        closeParameterLocalMenu();
        if (!model.parameters[id]) return;
        var token = ++parameterContextSerial;
        pendingParameterContext = { id: id, token: token, x: x, y: y };
        if (!hasNativeState || !dispatchNative("param-context|" + encodeURIComponent(id) + "|" + token
            + "|" + x + "|" + y + "|" + window.innerWidth + "|" + window.innerHeight)) {
          pendingParameterContext = null;

      }

      function receiveParameterContext(receipt) {
        var request = pendingParameterContext;
        if (!request || !receipt || request.token !== Number(receipt.token) || request.id !== receipt.id) return;
        pendingParameterContext = null;
        if (receipt.available && !receipt.handled) showParameterLocalMenu(request.id, request.x, request.y);
      }

      function performParameterContextAction(id, action) {
        if (!model.parameters[id] || ["reset", "copy", "paste"].indexOf(action) < 0) return;
        if (!hasNativeState) {
          if (action === "copy") {
            demoCopiedParameterValue = model.parameters[id].normalized;
            parameterContextStatus(tr("common.demo_value_copied_to_this_page"));
          } else if (action === "reset") {
            commitParam(id, model.parameters[id].defaultNormalized);
            parameterContextStatus(tr("common.reset_to_default_2"));
          } else if (demoCopiedParameterValue != null) {
            commitParam(id, demoCopiedParameterValue);
            parameterContextStatus(tr("common.demo_value_pasted"));
          } else parameterContextStatus(tr("common.no_copied_value_on_this_page"));
          return;
        }
        var token = ++parameterContextSerial;
        pendingParameterContextAction = { id: id, action: action, token: token };
        if (!dispatchNative("param-local|" + action + "|" + encodeURIComponent(id) + "|" + token)) {
          pendingParameterContextAction = null;
          parameterContextStatus(tr("common.native_parameter_connection_is_unavailable"));
        }
      }

      function receiveParameterContextAction(receipt) {
        var request = pendingParameterContextAction;
        if (!request || !receipt || request.token !== Number(receipt.token)
            || request.id !== receipt.id || request.action !== receipt.action) return;
        pendingParameterContextAction = null;
        if (!receipt.accepted) {
          parameterContextStatus(request.action === "paste" ? tr("common.the_clipboard_contains_no_compatible_fad_synth_value") : tr("common.parameter_action_did_not_complete"));
          return;

        parameterContextStatus(request.action === "copy" ? tr("common.value_copied_to_the_clipboard")

      }

      function boundCidMessages(messages) {
        var source = Array.isArray(messages) ? messages : [];
        var bounded = [];
        var totalCharacters = 0;
        for (var i = source.length - 1; i >= 0 && bounded.length < cidMessageLimit; i--) {
          var message = copyFields({}, source[i] || {});
          var content = String(message.content == null ? "" : message.content);
          if (content.length > cidSingleMessageCharacterLimit)
            content = content.slice(-cidSingleMessageCharacterLimit);
          var remainingCharacters = cidMessageCharacterLimit - totalCharacters;
          if (remainingCharacters <= 0) break;
          if (content.length > remainingCharacters) content = content.slice(-remainingCharacters);
          message.content = content;
          totalCharacters += content.length;
          bounded.unshift(message);
        }
        return bounded;
      }

      function captureWorkspaceFocus(workspace) {
        var active = document.activeElement;
        if (!active || !workspace.contains(active)) return null;
        var attributes = {};
        var hasIdentity = false;
        for (var i = 0; i < WORKSPACE_FOCUS_ATTRIBUTES.length; i++) {
          var name = WORKSPACE_FOCUS_ATTRIBUTES[i];
          if (!active.hasAttribute || !active.hasAttribute(name)) continue;
          attributes[name] = active.getAttribute(name);
          hasIdentity = true;
        }
        if (!hasIdentity) return null;
        var snapshot = { tagName: active.tagName, attributes: attributes };
        try {
          if (typeof active.selectionStart === "number") {
            snapshot.selectionStart = active.selectionStart;
            snapshot.selectionEnd = active.selectionEnd;
            snapshot.selectionDirection = active.selectionDirection;
          }
        } catch (error) {}
        return snapshot;
      }

        var uiFocusStarted = uiNow();
        var candidates = workspace.querySelectorAll("button,input,select,textarea,summary,[tabindex],[contenteditable='true']");
        var names = Object.keys(snapshot.attributes);
        for (var i = 0; i < candidates.length; i++) {

          if (candidate.tagName !== snapshot.tagName) continue;
          var matches = true;
          for (var a = 0; a < names.length; a++) {
            if (candidate.getAttribute(names[a]) !== snapshot.attributes[names[a]]) { matches = false; break; }
          }
          if (!matches) continue;
          if (candidate.disabled && candidate.closest(".bank-pages")) candidate = candidate.closest(".bank-pages").querySelector("button:not(:disabled)") || candidate;
          if (uiTrace) uiMark("workspace.focus.lookup", uiNow() - uiFocusStarted, workspaceRenderToken);
          uiFocusStarted = uiNow();
          try { candidate.focus({ preventScroll: true }); } catch (error) { candidate.focus(); }
          if (uiTrace) uiMark("workspace.focus.apply", uiNow() - uiFocusStarted, workspaceRenderToken);
          if (snapshot.selectionStart != null && candidate.setSelectionRange) {
            try { candidate.setSelectionRange(snapshot.selectionStart, snapshot.selectionEnd, snapshot.selectionDirection || "none"); } catch (selectionError) {}
          }
          return;
        }

      function drawFilterDisplay() {
        var surface = canvasSurface("filter-display", 1.5);

        var context = surface.context;
        var width = surface.width;
        var height = surface.height;
        if (Array.isArray(model.filterResponse) && model.filterResponse.length > 1) {
          var response = model.filterResponse;
          drawPixelPolyline(surface, response.map(function(db, i) {
            return {x:i/(response.length-1)*width,y:height*(.08+(18-db)/66*.84)};
          }), "#7a9cff");
          return true;
        }
        if (importedFilterActive()) return true;
        var meta = param(mainFilterCutoffParameter());
        var fs = Number(model.sampleRate) || 48000;
        var fc = Number(meta.plain) || 20 * Math.pow(1000,meta.normalized);
        fc = Math.max(20, Math.min(fs*.49,fc));
        var cutoff = Math.max(0,Math.min(1,Math.log(fc/20)/Math.log(1000)));
        var resonanceMeta = param("filter1.resonance");
        var resonance = Number.isFinite(resonanceMeta.plain) ? resonanceMeta.plain : .1+.87*resonanceMeta.normalized;
        var mode = choiceIndex(param("filter1.mode"));
        var g = Math.tan(Math.PI*fc/fs), g2=g*g, k=Math.max(.05,2*(1-resonance));

          var x=i/255, frequency=Math.min(fs*.49,20*Math.pow(1000,x));

          points.push({x:x*width,y:height*(.08+(18-db)/66*.84)});
