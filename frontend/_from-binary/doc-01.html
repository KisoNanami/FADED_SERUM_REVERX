<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="fadlab-onboarding-version" content="6">
<meta name="fad-ui-design-constitution" content="1">
<title data-i18n="common.fad_synth_first_run"></title>
<style>
@font-face {
  font-family: "FAD Mono";
  src: url(/fonts/onboarding-mono.ttf) format("truetype");
  font-display: swap;
}
@font-face {
  font-family: "FAD Pixel";
  src: url(/fonts/onboarding-pixel-latin.woff2) format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "FAD Pixel";
  src: url(/fonts/onboarding-pixel-zh.woff2) format("woff2");
  unicode-range: U+2E80-303F, U+31C0-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF;
  font-display: swap;
}
:root {
  --paper: #e8e5db;
  --paper-lift: #f6f4ec;
  --paper-deep: #d7d3c5;
  --plate: #eeece4;
  --ink: #1c1b14;
  --ink-soft: #4c4a40;
  --ink-faint: #8b8779;
  --indigo: #3d4a78;
  --indigo-mid: #596aa6;
  --indigo-light: #7a9cff;
  --pine: #50604e;
  --brass: #63558d;
  --rust: #ac4b2c;
  --screen: #1c1b14;
  --screen-ink: #e4e1d4;
  --bar-height: 34px;
  --rail-height: 58px;
  --rail-prev-width: calc(82px * var(--fad-font-scale, 1.15));
  --rail-next-width: calc(132px * var(--fad-font-scale, 1.15));
  --rule: 1.5px solid var(--ink);
  --move: 240ms cubic-bezier(0.77, 0, 0.175, 1);
  --font-ui: "FAD Pixel", "PingFang SC", "Microsoft YaHei UI", monospace;
  --font-mono: "FAD Mono", "SFMono-Regular", Consolas, monospace;
  --font-doc: "Iowan Old Style", Charter, "Songti SC", Georgia, serif;
  --space-doc-1: 8px;
  --space-doc-2: 12px;
  --space-doc-3: 16px;
  --space-doc-4: 24px;
  --space-doc-5: 36px;
  /* Standard layout tier. Compact and Expanded replace these discretely. */
  --type-display: calc(60px * var(--fad-font-scale, 1.15));
  --type-heading: calc(36px * var(--fad-font-scale, 1.15));
  --type-lede: calc(18px * var(--fad-font-scale, 1.15));
  --type-hero-title: calc(26px * var(--fad-font-scale, 1.15));
  --slide-padding-block: var(--space-doc-5);
  --slide-padding-inline: calc(var(--space-doc-4) + var(--space-doc-4));
  --hero-column-gap: calc(var(--space-doc-5) + var(--space-doc-5));
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  min-width: 760px;
  min-height: 620px;
  color: var(--ink);
  background-color: var(--paper);
  font: calc(14px * var(--fad-font-scale, 1.15))/1.5 var(--font-doc);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
button, input { font-family: var(--font-ui); }
button { color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--indigo-light); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.os-bar {
  position: fixed;
  z-index: 30;
  top: 0;
  left: 0;
  right: 0;
  height: var(--bar-height);
  display: grid;
  grid-template-columns: 88px 228px minmax(0, 1fr) 88px 224px;
  align-items: stretch;
  border-bottom: var(--rule);
  background: var(--paper-lift);
  font: calc(11px * var(--fad-font-scale, 1.15))/1 var(--font-ui);
}
.os-cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; padding: 0 13px; border-right: var(--rule); white-space: nowrap; }
.os-brand { font-weight: 800; }
.os-route { color: var(--paper-lift); background: var(--ink); }
.os-spacer { flex: 1; }
.os-state { gap: 7px; border-right: 0; border-left: var(--rule); }
.status-lamp { width: 7px; height: 7px; border: 1px solid var(--ink); border-radius: 50%; background: var(--pine); }
.version-readout { border-right: 0; border-left: var(--rule); color: var(--ink-soft); font-family: var(--font-mono); }
#slider {
  position: fixed;
  inset: var(--bar-height) 0 var(--rail-height);
  overflow: hidden;
}
.slide {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: var(--slide-padding-block) var(--slide-padding-inline);
  overflow-y: auto;
  overscroll-behavior: contain;
  opacity: 0;
  visibility: hidden;
  transform: translateX(var(--space-doc-4));
  transition: opacity 140ms ease, transform 180ms ease, visibility 0s linear 180ms;
}
.slide.active {
  z-index: 2;
  opacity: 1;
  visibility: visible;
  transform: none;
  transition-delay: 0s;
}
.slide:focus { outline: none; }
.slide:focus-visible { outline: 2px solid var(--indigo-light); outline-offset: -2px; }
.sheet { width: min(1100px, 100%); margin-block: auto; }
.eyebrow {
  display: flex;
  align-items: center;
  gap: var(--space-doc-1);
  margin: 0 0 var(--space-doc-2);
  color: var(--indigo);
  font: 700 calc(11px * var(--fad-font-scale, 1.15))/1.2 var(--font-ui);
}
.eyebrow::before { content: ""; width: 18px; height: 7px; background: var(--indigo); }
h1, h2, h3, p { margin-top: 0; }
h1, h2, h3, .hero-title-line { font-family: var(--font-ui); }
h1 { margin-bottom: var(--space-doc-2); font-size: var(--type-display); line-height: .96; letter-spacing: 0; }
h2 { margin-bottom: var(--space-doc-2); font-size: var(--type-heading); line-height: 1.08; letter-spacing: 0; }
h3 { margin-bottom: var(--space-doc-1); font-size: calc(17px * var(--fad-font-scale, 1.15)); line-height: 1.25; letter-spacing: 0; }
.lede { max-width: 780px; margin-bottom: var(--space-doc-4); color: var(--ink-soft); font-size: var(--type-lede); line-height: 1.55; }
.micro { color: var(--ink-faint); font: calc(11px * var(--fad-font-scale, 1.15))/1.55 var(--font-mono); }
.brand-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: auto;
  height: auto;
  overflow: hidden;
  pointer-events: none;
  transform: none;
  opacity: 1;
  transition: none;
}
.brand-layer canvas { display: block; width: 100%; height: 100%; }
.brand-source { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
body[data-dither-state="exit"] .brand-layer { transition: none; }
.hero-sheet { display: grid; grid-template-columns: minmax(250px, .82fr) minmax(420px, 1.18fr); align-items: center; gap: var(--hero-column-gap); }
.hero-mark-space { min-height: 300px; }
.origin-line { width: fit-content; margin-top: var(--space-doc-4); padding-top: var(--space-doc-2); border-top: 3px solid var(--rust); color: var(--ink-soft); font: calc(11px * var(--fad-font-scale, 1.15))/1.45 "FAD Mono", "SFMono-Regular", monospace; }
.hero-kicker { margin-bottom: var(--space-doc-2); color: var(--rust); font: 700 calc(12px * var(--fad-font-scale, 1.15))/1.2 var(--font-ui); }
.hero-title-line { max-width: 630px; margin-bottom: var(--space-doc-2); font-size: var(--type-hero-title); line-height: 1.25; font-weight: 700; }
.hero-detail { max-width: 680px; margin-bottom: 0; color: var(--ink-soft); font-size: calc(15px * var(--fad-font-scale, 1.15)); line-height: 1.65; }
.blueprint {
  margin-top: var(--space-doc-4);
  border: var(--rule);
  background: var(--screen);
  color: var(--screen-ink);
  box-shadow: 5px 5px 0 rgba(28,27,20,.18);
}
.blueprint-head { display: flex; justify-content: space-between; gap: var(--space-doc-3); padding: var(--space-doc-1) var(--space-doc-2); border-bottom: 1px solid #57554d; color: var(--indigo-light); font: calc(11px * var(--fad-font-scale, 1.15))/1.2 var(--font-ui); }
.machine-path { display: grid; grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr) 34px minmax(0, 1fr); align-items: stretch; padding: var(--space-doc-4) var(--space-doc-3); }
.machine-stage { min-height: 132px; padding: var(--space-doc-2); border: 1px solid #817e73; }
.machine-stage h3 { margin-bottom: var(--space-doc-1); color: var(--indigo-light); }
.machine-index { display: block; margin-bottom: var(--space-doc-1); color: #9c988a; font: calc(10px * var(--fad-font-scale, 1.15))/1 "FAD Mono", monospace; }
.machine-stage p { margin: 0; color: #d3d0c4; }
.machine-stage strong { color: var(--screen-ink); }
.machine-arrow { display: grid; place-items: center; color: #817e73; font: 700 18px/1 "FAD Mono", monospace; }
.blueprint-foot { padding: var(--space-doc-2) var(--space-doc-3); border-top: 1px solid #57554d; color: #b8b4a6; }
.workflow-list { margin-top: var(--space-doc-4); border-top: var(--rule); }
.workflow-row { display: grid; grid-template-columns: 62px minmax(190px, .62fr) minmax(0, 1.38fr); border-bottom: var(--rule); background: rgba(246,244,236,.68); }
.workflow-num { display: grid; place-items: center; border-right: var(--rule); color: var(--paper-lift); background: var(--ink); font: 700 calc(13px * var(--fad-font-scale, 1.15))/1 "FAD Mono", monospace; }
.workflow-name { padding: var(--space-doc-3); border-right: var(--rule); }
.workflow-name small { display: block; margin-top: var(--space-doc-1); color: var(--ink-faint); font: calc(10px * var(--fad-font-scale, 1.15))/1.4 "FAD Mono", monospace; }
.workflow-copy { padding: var(--space-doc-3); color: var(--ink-soft); }
.confirmation-rule { margin-top: var(--space-doc-3); padding: var(--space-doc-2) var(--space-doc-3); border-left: 5px solid var(--rust); background: var(--paper-deep); font-weight: 700; }
.lab-layout { display: grid; grid-template-columns: minmax(260px, .65fr) minmax(420px, 1.35fr); gap: var(--space-doc-4); align-items: stretch; margin-top: var(--space-doc-4); }
.lab-copy { display: flex; flex-direction: column; justify-content: space-between; padding: var(--space-doc-3); border: var(--rule); background: var(--paper-lift); box-shadow: 4px 4px 0 rgba(28,27,20,.16); }
.lab-copy p { color: var(--ink-soft); }
.terminal { min-height: 330px; border: var(--rule); background: var(--screen); color: var(--screen-ink); box-shadow: 5px 5px 0 rgba(28,27,20,.18); font: calc(12px * var(--fad-font-scale, 1.15))/1.55 "FAD Mono", monospace; }
.terminal-bar { display: flex; justify-content: space-between; padding: var(--space-doc-1) var(--space-doc-2); border-bottom: 1px solid #57554d; color: var(--indigo-light); }
.terminal-body { padding: var(--space-doc-3); }
.prompt-label { margin-bottom: var(--space-doc-1); color: #9c988a; }
.prompt-box { padding: var(--space-doc-2); border: 1px solid #67645b; color: var(--screen-ink); background: #26251f; }
.lab-stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-doc-1); margin-top: var(--space-doc-3); }
.lab-step { min-height: 88px; padding: var(--space-doc-2); border: 1px solid #67645b; opacity: 1; }
.slide.active .lab-step { animation: terminal-stage 180ms both; animation-delay: calc(var(--stage) * 60ms); }
.lab-step b { display: block; margin-bottom: var(--space-doc-1); color: var(--indigo-light); }
.terminal-actions { display: flex; gap: var(--space-doc-1); margin-top: var(--space-doc-3); }
.terminal-key { flex: 1; padding: var(--space-doc-1) var(--space-doc-2); border: 1px solid #67645b; color: #aaa697; }
.terminal-key.commit { border-color: var(--indigo-light); color: var(--indigo-light); }
.terminal-note { margin-top: var(--space-doc-2); color: var(--indigo-light); font-weight: 700; }
@keyframes terminal-stage { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.account-grid { display: grid; grid-template-columns: minmax(300px, .78fr) minmax(420px, 1.22fr); gap: var(--space-doc-4); margin-top: var(--space-doc-4); }
.device-panel, .license-panel { border: var(--rule); background: var(--paper-lift); box-shadow: 4px 4px 0 rgba(28,27,20,.16); }
.panel-head { display: flex; justify-content: space-between; align-items: center; min-height: 36px; padding: var(--space-doc-1) var(--space-doc-2); border-bottom: var(--rule); font: 700 calc(11px * var(--fad-font-scale, 1.15))/1.2 var(--font-ui); }
.panel-head > span:first-child { flex-shrink: 0; }
.panel-head > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-body { padding: var(--space-doc-3); }
.device-code-row { display:flex;align-items:stretch;gap:6px;margin:var(--space-doc-1) 0 var(--space-doc-2); }
.device-code { flex:1;min-width:0;margin:0;padding:var(--space-doc-2);border:var(--rule);background:var(--paper-deep);font:700 calc(19px * var(--fad-font-scale, 1.15))/1.2 "FAD Mono",monospace;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;cursor:text; }
.device-code-row .command { flex:none;width:auto;min-width:44px;margin:0;padding-inline:10px; }
.auth-state { display: flex; height: 44px; overflow-y: auto; align-items: center; gap: var(--space-doc-1); color: var(--rust); font: calc(11px * var(--fad-font-scale, 1.15))/1.4 "FAD Mono", monospace; }
.auth-state::before { content: ""; width: 8px; height: 8px; border: 1px solid var(--ink); background: var(--rust); }
body[data-authorized="true"] .auth-state { color: var(--pine); }
body[data-authorized="true"] .auth-state::before { background: var(--pine); }
[hidden] { display: none !important; }
.account-actions { display: grid; gap: var(--space-doc-1); }
.command {
  min-height: 40px;
  padding: var(--space-doc-1) var(--space-doc-2);
  border: var(--rule);
  border-radius: 0;
  background: var(--paper-lift);
  box-shadow: 3px 3px 0 rgba(28,27,20,.20);
  text-align: left;
  font: 700 calc(11px * var(--fad-font-scale, 1.15))/1.2 var(--font-ui);
  cursor: pointer;
}
.command:hover { background: var(--ink); color: var(--paper-lift); }
.command:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 rgba(28,27,20,.2); }
.command.primary { background: var(--indigo); color: var(--paper-lift); }
.command.primary:hover { background: var(--ink); }
.command.refresh { color: var(--indigo); }
.account-help { min-height: 28px; padding: 0; border: 0; background: transparent; color: var(--indigo); text-align: left; font: calc(11px * var(--fad-font-scale, 1.15))/1.4 var(--font-ui); cursor: pointer; text-decoration: underline; }
.account-help:hover { color: var(--ink); }
.authorization-recovery { visibility: hidden; }
.authorization-recovery.available { visibility: visible; color: var(--rust); }
.handoff-note { height: 48px; overflow-y: auto; margin-top: var(--space-doc-2); padding: var(--space-doc-1) var(--space-doc-2); border-left: 4px solid var(--indigo); color: var(--ink-soft); font: calc(11px * var(--fad-font-scale, 1.15))/1.45 var(--font-mono); }
.auth-error {
  min-height: 48px;
  max-height: 48px;
  margin-top: var(--space-doc-2);
  padding-right: 4px;
  overflow-y: auto;
  overscroll-behavior: contain;
  overflow-wrap: anywhere;
  color: var(--rust);
  font: calc(11px * var(--fad-font-scale, 1.15))/1.45 var(--font-mono);
}
.agreement { display: grid; grid-template-columns: 22px 1fr; gap: var(--space-doc-2); align-items: start; margin-top: var(--space-doc-3); padding: var(--space-doc-2); border: var(--rule); background: var(--paper-deep); }
.agreement input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--indigo); }
.agreement-copy label { cursor: pointer; }
.legal-links { display: inline; }
.legal-link { display: inline; min-height: 24px; padding: 0 2px; border: 0; border-bottom: 1px solid currentColor; border-radius: 0; color: var(--indigo); background: transparent; font: inherit; font-family: var(--font-ui); cursor: pointer; }
.legal-link:hover { color: var(--paper-lift); background: var(--ink); }
.privacy { margin-top: var(--space-doc-2); padding: var(--space-doc-2); border-left: 5px solid var(--indigo); color: var(--ink-soft); font-size: calc(12px * var(--fad-font-scale, 1.15)); line-height: 1.6; }
.privacy a { color: var(--indigo); text-decoration: underline; }
.legal-dialog-layer { position: fixed; z-index: 90; inset: 0; display: grid; place-items: center; padding: var(--space-doc-4); background: rgba(28,27,20,.58); }
.legal-dialog { width: min(680px, 100%); max-height: min(560px, calc(100vh - 48px)); overflow: auto; border: var(--rule); background: var(--paper-lift); box-shadow: 8px 8px 0 rgba(28,27,20,.35); user-select: text; }
.legal-dialog:focus { outline: none; }
.legal-dialog:focus-visible { outline: 2px solid var(--indigo-light); outline-offset: -2px; }
.legal-dialog-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-doc-3); min-height: 44px; padding: var(--space-doc-1) var(--space-doc-2); border-bottom: var(--rule); background: var(--paper-deep); }
.legal-dialog-head h3 { margin: 0; }
.legal-dialog-close { min-width: 64px; min-height: 44px; border: var(--rule); border-radius: 0; background: var(--paper-lift); font: 700 calc(11px * var(--fad-font-scale, 1.15))/1.2 var(--font-ui); cursor: pointer; }
.legal-dialog-close:hover { color: var(--paper-lift); background: var(--ink); }
.legal-dialog-body { padding: var(--space-doc-4); color: var(--ink-soft); font-size: calc(15px * var(--fad-font-scale, 1.15)); line-height: 1.7; }
.legal-dialog-body p:last-child { margin-bottom: 0; }
.bottom-rail {
  position: fixed;
  z-index: 40;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--rail-height);
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr) max(290px, calc(var(--rail-prev-width) + var(--rail-next-width) + 20px));
  align-items: center;
  border-top: var(--rule);
  background: var(--paper-lift);
}
.step-readout { padding-left: 16px; color: var(--ink-soft); font: calc(11px * var(--fad-font-scale, 1.15))/1 var(--font-mono); }
.segments { display: flex; justify-content: center; gap: 7px; }
.segment {
  position: relative;
  width: 38px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  cursor: pointer;
}
.segment::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 9px;
  border: 1px solid var(--ink);
  background: var(--paper-deep);
  transform: translateY(-50%);
}
.segment.active::before { background: var(--indigo); }
.rail-actions { display: grid; grid-template-columns: var(--rail-prev-width) var(--rail-next-width); justify-content: end; align-items: center; gap: var(--space-doc-1); padding-right: var(--space-doc-2); }
.rail-actions .nav-button { width: 100%; min-width: 0; }
#btn-prev { grid-column: 1; grid-row: 1; }
#btn-next, #btn-enter { grid-column: 2; grid-row: 1; }
.nav-button.slot-parked { visibility: hidden; }
.nav-button {
  min-width: 82px;
  min-height: 34px;
  padding: var(--space-doc-1) var(--space-doc-2);
  border: var(--rule);
  border-radius: 0;
  background: var(--paper-lift);
  box-shadow: 2px 2px 0 rgba(28,27,20,.2);
  font: 700 calc(11px * var(--fad-font-scale, 1.15))/1 var(--font-ui);
  cursor: pointer;
}
.nav-button:hover:not(:disabled) { background: var(--ink); color: var(--paper-lift); }
.nav-button:active:not(:disabled) { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(28,27,20,.2); }
.nav-button.enter { min-width: 132px; border-color: var(--indigo); background: var(--indigo); color: var(--paper-lift); }
.nav-button:disabled { color: var(--ink-faint); border-color: var(--ink-faint); background: var(--paper-deep); box-shadow: none; cursor: not-allowed; }
.hidden { display: none !important; }
.accept-error { position: fixed; z-index: 50; right: var(--space-doc-2); bottom: calc(var(--rail-height) + var(--space-doc-2)); max-width: 390px; padding: var(--space-doc-1) var(--space-doc-2); border: 1px solid var(--rust); background: var(--paper-lift); color: var(--rust); font: calc(11px * var(--fad-font-scale, 1.15))/1.45 var(--font-mono); }
/* Compact layout tier. */
@media (max-height: 760px), (max-width: 860px) {
  :root {
    --type-display: calc(48px * var(--fad-font-scale, 1.15));
    --type-heading: calc(28px * var(--fad-font-scale, 1.15));
    --type-lede: calc(16px * var(--fad-font-scale, 1.15));
    --type-hero-title: calc(22px * var(--fad-font-scale, 1.15));
    --slide-padding-block: var(--space-doc-3);
    --slide-padding-inline: calc(var(--space-doc-4) + var(--space-doc-4));
    --hero-column-gap: calc(var(--space-doc-4) + var(--space-doc-4));
  }
}
/* Expanded layout tier. */
@media (min-width: 1280px) and (min-height: 900px) {
  :root {
    --type-display: calc(72px * var(--fad-font-scale, 1.15));
    --type-heading: calc(42px * var(--fad-font-scale, 1.15));

      if (!window.__JUCE__ || !window.__JUCE__.backend || !window.__JUCE__.backend.emitEvent) return false;
      var init = window.__JUCE__.initialisationData;
      var functions = init && init.__juce__functions ? init.__juce__functions : [];
      if (!functions.indexOf || functions.indexOf("fadNativeCommand") < 0) return false;
      installNativeCompletionListener();
      window.__JUCE__.backend.emitEvent("__juce__invoke", {
        name: "fadNativeCommand",
        params: [url],
        resultId: resultId
      });
      return true;
    } catch (error) {}
    return false;
  }

  function dispatchNativeNavigation(url) {
    try { window.location.href = url; } catch (error) {}
    try {
      var link = document.createElement("a");
      link.href = url;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    } catch (error) {}
  }

  function dispatchNative(url) {
    commandSequence += 1;
    var resultId = Date.now() + commandSequence;
    activeResultId = resultId;
    activeCommandIsAccept = url.indexOf("fadlab://onboarding-accept?") === 0;
    activeCommandIsCopy = url.indexOf("fadlab://onboarding-copy-device-code?") === 0;
    var sentToNative = dispatchJuceNativeCommand(url, resultId);
    setTimeout(function () { dispatchNativeNavigation(url); }, sentToNative ? 120 : 0);
  }

  function dispatchCapability(base) { dispatchNative(capabilityRoute(base)); }

  function showAcceptError(message) {
    var error = document.getElementById("accept-error");
    error.textContent = typeof message === "string" ? message : tr("common.could_not_save_setup_check_access_and_try_again");
    error.classList.remove("hidden");
    enterButton.disabled = !(authState.activated && agreement.checked);
  }

  window.fadOnboardingNativeAcceptRejected = function () {
    if (acceptRecoveryTimer) clearTimeout(acceptRecoveryTimer);
    showAcceptError(authState.error || tr("common.authorisation_is_not_complete_check_access_then_try_entering_again"));
  };

  function updateAcceptAvailability() {
    enterButton.disabled = !(authState.activated && agreement.checked) || acceptCompleted;
  }

  function formatAuthorizationStatus() {
    if (waitingForBrowser) return tr("common.waiting_for_the_browser_return_to_fad_synth_when_finished");
    if (!authState.activated) {
      if (authState.error) return tr("common.connection_failed_see_the_message_below");
      return authState.storeManaged ? tr("common.awaiting_access_connect_an_existing_account_or_restore_purchases") : tr("common.not_connected_sign_in_and_connect_your_existing_license");
    }
    if (authState.isTrial && authState.trialExpiresAt > 0) {
      var remainingDays = Math.max(0, Math.ceil((authState.trialExpiresAt - Date.now()) / 86400000));
      return tr("common.connected_term_license_remaining") + remainingDays + tr("common.days_2");
    }
    if (authState.entitlementExpiresAt > 0) {
      var now = Date.now();
      if (now < authState.entitlementExpiresAt) {
        return tr("common.access_valid_until")
          + new Date(authState.entitlementExpiresAt).toLocaleString("zh-CN");
      }
      if (authState.entitlementGraceUntil > now) {
        return tr("common.access_expired_device_grace_period_until")
          + new Date(authState.entitlementGraceUntil).toLocaleString("zh-CN")
          + tr("common.not_a_renewal");
      }
    }
    return tr("common.connected_device_access_is_valid");
  }

  function renderAuthState() {
    document.body.dataset.authorized = authState.activated ? "true" : "false";
    document.getElementById("store-settings").hidden = !authState.storeManaged || !authState.standalone;
    document.getElementById("store-guidance").hidden = !authState.storeManaged || authState.standalone;
    if (authState.storeManaged) {
      document.getElementById("account-intro").textContent = tr("common.connect_an_existing_fad_account_or_purchase_access_through_the");
      document.getElementById("license-summary").textContent = tr("common.existing_fad_access_continues_after_verification_purchase_and_restore_in");
      document.getElementById("trial-agreement").textContent = tr("common.plans_and_terms_are_shown_on_the_purchase_page");
    }
    document.getElementById("device-code").textContent = authState.deviceCode || tr("common.waiting_for_device_code");
    document.getElementById('copy-device-code').disabled = !authState.deviceCode;
    var accountEmail = document.getElementById("account-email");
    accountEmail.textContent = authState.email || (authState.activated ? tr("common.connected") : tr("common.not_signed_in"));
    accountEmail.title = authState.email;
    document.getElementById("auth-tier").textContent = authState.isTrial ? tr("common.term_license") : authState.tier || (authState.activated ? tr("common.authorised") : tr("common.not_authorised"));
    var recoveryRequired = !authState.activated
      && (authState.errorCode === "FAD-AUTH-STATE-SCHEMA"
        || authState.errorCode === "FAD-AUTH-STATE-CORRUPT");
    var recoveryButton = document.getElementById("reset-auth");
    recoveryButton.disabled = !recoveryRequired;
    recoveryButton.classList.toggle("available", recoveryRequired);
    recoveryButton.setAttribute("aria-hidden", recoveryRequired ? "false" : "true");
    document.getElementById("refresh-auth").disabled = recoveryRequired;
    // DIRECT_ONLY_BEGIN
    document.getElementById("redeem-cdk").disabled = recoveryRequired;
    // DIRECT_ONLY_END
    var connectAccountButton = document.getElementById("connect-account");
    connectAccountButton.textContent = authState.activated ? tr("common.account_connected_2") : tr("common.sign_in_or_create_account");
    connectAccountButton.disabled = authState.activated || recoveryRequired;
    connectAccountButton.classList.toggle("primary", !authState.activated);
    document.getElementById("auth-status").textContent = formatAuthorizationStatus();
    document.getElementById("handoff-note").textContent = waitingForBrowser
      ? tr("common.complete_the_steps_in_your_browser_keep_fad_synth_open")
      : authState.activated
        ? tr("common.device_connected_read_and_accept_the_terms_then_click_enter")
        : authState.error
          ? tr("common.connection_incomplete_read_the_error_below_correct_it_and_try")
          : tr("common.keep_fad_synth_open_it_will_unlock_after_you_finish");
    var authError = document.getElementById("auth-error");
    authError.textContent = authState.error
      ? ((authState.errorCode ? authState.errorCode + " · " : "") + authState.error)
      : "";
    authError.tabIndex = authState.error ? 0 : -1;
    authError.scrollTop = 0;
    updateAcceptAvailability();
  }

  window.fadOnboardingReceiveAuthState = function (state) {
    state = normalizeAuthState(state);
    if (state.revision <= authStateRevision) return;
    authStateRevision = state.revision;
    authState = state;
    if (state.activated || state.error) waitingForBrowser = false;
    renderAuthState();
  };

  function setDitherState(state) {
    var previousState = document.body.dataset.ditherState || "boot";
    document.body.dataset.ditherState = state;
    if (!dither) return;
    if (!nativeRuntimeActive || document.hidden) {
      dither.setActive(false);
      return;
    }
    if (state === "boot") {
      if (previousState === "corner" && typeof dither.restoreHero === "function")
        dither.restoreHero(0.55);
      else
        dither.replay();
    } else if (state === "exit") {
      dither.exit();
    } else if (previousState === "boot") {
      if (typeof dither.wakeTo === "function") dither.wakeTo("right", 0.82, 0.55);
      else dither.setActive(true);
    }
  }

  function notifyPage(page) {
    dispatchNativeNavigation("fadlab://onboarding-page/" + page);
  }

  function isElementKeyboardReachable(element) {
    if (!element || element === document.body || !document.body.contains(element)) return false;
    if (element.disabled) return false;
    var owningSlide = element.closest ? element.closest(".slide") : null;
    if (owningSlide && !owningSlide.classList.contains("active")) return false;
    var style = window.getComputedStyle(element);
    return style.display !== "none" && style.visibility !== "hidden";
  }

  function migrateFocusAfterSlideChange(previousFocus, page) {
    if (!previousFocus || previousFocus === document.body) return;
    if (isElementKeyboardReachable(previousFocus)) return;
    var successor = slides[page];
    if (previousFocus === nextButton && isElementKeyboardReachable(enterButton)) successor = enterButton;
    else if (previousFocus === nextButton && isElementKeyboardReachable(previousButton)) successor = previousButton;
    else if ((previousFocus === enterButton || previousFocus === previousButton) && isElementKeyboardReachable(nextButton)) successor = nextButton;
    if (successor && successor.focus) successor.focus();
  }

  function applyRovingFocusOrder(page) {
    for (var i = 0; i < totalSlides; i++) {
      segments[i].tabIndex = i === page ? 0 : -1;
      slides[i].tabIndex = i === page ? 0 : -1;
    }
  }

  function updateNavigationCopy(page) {
    nextButton.textContent = page === 0 ? tr("common.explore_the_sound") : tr("common.connect_account");
  }

  function goToSlide(page, options) {
    if (page < 0 || page >= totalSlides || page === currentSlide) return;
    var previousFocus = document.activeElement;
    currentSlide = page;
    updateNavigationCopy(page);
    for (var i = 0; i < totalSlides; i++) {
      slides[i].classList.toggle("active", i === page);
      segments[i].classList.toggle("active", i === page);
      segments[i].setAttribute("aria-selected", i === page ? "true" : "false");
    }
    applyRovingFocusOrder(page);
    document.getElementById("counter-num").textContent = String(page + 1).padStart(2, "0");
    previousButton.disabled = page === 0;
    nextButton.classList.toggle("slot-parked", page === totalSlides - 1);
    enterButton.classList.toggle("slot-parked", page !== totalSlides - 1);
    if (options && options.focusActiveTab) segments[page].focus();
    else migrateFocusAfterSlideChange(previousFocus, page);
    setDitherState(page === 0 ? "boot" : "corner");
    notifyPage(page);
    if (page === totalSlides - 1 && !authState.activated && !activationStarted) {
      activationStarted = true;
      dispatchCapability("fadlab://onboarding-auth/start");
    }
  }

  function accept() {
    if (acceptCompleted || !authState.activated || !agreement.checked) {
      updateAcceptAvailability();
      return;
    }
    enterButton.disabled = true;
    document.getElementById("accept-error").classList.add("hidden");
    dispatchNative(nonceRoute("fadlab://onboarding-accept"));
    if (acceptRecoveryTimer) clearTimeout(acceptRecoveryTimer);
    acceptRecoveryTimer = setTimeout(showAcceptError, 2500);
  }

  window.fadOnboardingNativeAcceptResolved = function () {
    acceptCompleted = true;
    if (acceptRecoveryTimer) clearTimeout(acceptRecoveryTimer);
    enterButton.textContent = tr("common.entering_fad_synth");
    enterButton.disabled = true;
    setDitherState("exit");
  };

  function initDither() {
    var source = document.getElementById("onboarding-logo");
    source.onerror = function () {
      if (source.dataset.fallback) return;
      source.dataset.fallback = "1";
      source.src = "/FAD%20Logo.png";
    };
    if (!window.FADDitherEngine) return;
    dither = window.FADDitherEngine.mount(
      document.getElementById("onboarding-dither"),
      source,
      {
        active: nativeRuntimeActive && !document.hidden,
        columns: 72,
        maxDpr: 3,
        scene: "hero",
        scale: 0.88,
        fill: 0.85,
        braille: 0.55,
        colors: ["#3D4A78", "#596AA6", "#7A9CFF", "#22348E"]
      }
    );
  }

  function syncOnboardingRuntimeActive() {
    if (!dither) return;
    if (!nativeRuntimeActive || document.hidden) {
      dither.suspend();
    } else if (currentSlide === 0) {
      dither.replay();
    } else if (typeof dither.wakeTo === "function") {
      dither.wakeTo("right", 0.82, 0.55);
    }
  }

  window.fadOnboardingSetRuntimeActive = function (active) {
    nativeRuntimeActive = active !== false;
    syncOnboardingRuntimeActive();
  };
  document.addEventListener("visibilitychange", syncOnboardingRuntimeActive);

  previousButton.addEventListener("click", function () { goToSlide(currentSlide - 1); });
  nextButton.addEventListener("click", function () { goToSlide(currentSlide + 1); });
  enterButton.addEventListener("click", accept);
  agreement.addEventListener("change", updateAcceptAvailability);
  // Legacy bridge route literals kept for bundled/native compatibility; the UI exposes one account CTA.
  // fadlab://onboarding-account/connect | fadlab://onboarding-account/login | fadlab://onboarding-account/register | fadlab://onboarding-account/help
  // fadlab://onboarding-legal/eula | fadlab://onboarding-legal/terms | fadlab://onboarding-legal/privacy
  document.getElementById("refresh-auth").addEventListener("click", function () {
    waitingForBrowser = true;
    renderAuthState();
    dispatchCapability("fadlab://onboarding-auth/refresh");
  });
  document.getElementById('copy-device-code').addEventListener('click', function () {
    if (authState.deviceCode) dispatchCapability('fadlab://onboarding-copy-device-code');
  });
  document.getElementById("connect-account").addEventListener("click", function () {
    waitingForBrowser = true;
    renderAuthState();
    dispatchCapability("fadlab://onboarding-account/connect");
  });
  // DIRECT_ONLY_BEGIN
  document.getElementById("redeem-cdk").addEventListener("click", function () {
    waitingForBrowser = true;
    renderAuthState();
    dispatchCapability("fadlab://onboarding-account/cdk");
  });
  // DIRECT_ONLY_END
  document.getElementById("store-settings").addEventListener("click", function () {
    dispatchCapability("fadlab://onboarding-store/settings");
  });
  document.getElementById("account-help").addEventListener("click", function () {
    dispatchCapability("fadlab://onboarding-account/help");
  });
  document.getElementById("reset-auth").addEventListener("click", function () {
    dispatchCapability("fadlab://onboarding-auth/reset");
  });
  legalDialogClose.addEventListener("click", closeLegalDocument);
  legalDialogOpen.addEventListener("click", function () {
    dispatchCapability("fadlab://onboarding-legal/" + legalDialogPath);
  });
  for (var legalIndex = 0; legalIndex < legalButtons.length; legalIndex++) {
    legalButtons[legalIndex].addEventListener("click", function () { openLegalDocument(this); });
  }
  for (var i = 0; i < segments.length; i++) {
    segments[i].addEventListener("click", function () { goToSlide(Number(this.dataset.slide)); });
  }
  var segmentRail = document.querySelector(".segments");
  segmentRail.addEventListener("keydown", function (event) {
    var target = currentSlide;
    if (event.key === "ArrowLeft") target = currentSlide - 1;
    else if (event.key === "ArrowRight") target = currentSlide + 1;
    else if (event.key === "Home") target = 0;
    else if (event.key === "End") target = totalSlides - 1;
    else return;
    event.preventDefault();
    event.stopPropagation();
    target = Math.max(0, Math.min(totalSlides - 1, target));
    if (target === currentSlide) segments[target].focus();
    else goToSlide(target, { focusActiveTab: true });
  });
  document.addEventListener("keydown", function (event) {
    if (!legalDialogLayer.classList.contains("hidden")) {
      if (event.key === "Escape") {
        event.preventDefault();
        closeLegalDocument();
      } else if (event.key === "Tab") {
        event.preventDefault();
        var focusable = [legalDialogClose, legalDialogOpen];
        var focusIndex = focusable.indexOf(document.activeElement);
        var focusStep = event.shiftKey ? -1 : 1;
        if (focusIndex < 0) focusIndex = event.shiftKey ? 0 : -1;
        focusable[(focusIndex + focusStep + focusable.length) % focusable.length].focus();
      }
      return;
    }
    if (event.key === "ArrowLeft") goToSlide(currentSlide - 1);
    if (event.key === "ArrowRight") goToSlide(currentSlide + 1);
  });

  updateNavigationCopy(currentSlide);
  renderAuthState();
  function refreshOnboardingLanguage(next){renderAuthState();updateNavigationCopy(currentSlide);}
var unsubscribeLanguage=window.FADI18n.onChange(refreshOnboardingLanguage,"onboarding");
window.addEventListener("pagehide",function(){unsubscribeLanguage();});
window.addEventListener("pageshow",function(event){if(event.persisted)unsubscribeLanguage=window.FADI18n.onChange(refreshOnboardingLanguage,"onboarding");});
  initDither();
}());
</script>
</body>
</html>
